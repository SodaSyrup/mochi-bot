<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochi 🍡 • 404 Page Not Found</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍡</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-main); font-family: var(--font-body); color: var(--text-main); margin: 0;">
  <div style="text-align: center; max-width: 460px; padding: 40px 32px; background: var(--bg-card); border: 1px solid var(--border-medium); border-radius: var(--radius-lg); box-shadow: var(--shadow-modal);">
    <div style="font-size: 48px; margin-bottom: 16px;">🍡</div>
    <h1 style="font-size: 42px; font-weight: 700; margin: 0 0 6px 0; color: var(--text-main); letter-spacing: -0.03em;">404</h1>
    <h2 style="font-size: 18px; font-weight: 600; margin-bottom: 10px; color: var(--text-muted);">Page Not Found</h2>
    <p style="font-size: 13.5px; color: var(--text-dim); margin-bottom: 24px; line-height: 1.5;">The dashboard page you are looking for does not exist or has been moved.</p>
    <a href="/" class="btn btn-primary">
      <i class="fa-solid fa-arrow-left"></i> Return to Overview
    </a>
  </div>
</body>
</html>
