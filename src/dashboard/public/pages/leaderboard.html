<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochi · Leaderboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍡</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body data-page="leaderboard">
  <div id="app">
    <div id="sidebar-root"></div>
    <main class="main-content">
      <div id="topbar-root"></div>
      <div class="page-container">
        <section id="leaderboard-view" class="view-section active">
          <div class="page-header">
            <div>
              <h2>Leaderboard</h2>
              <p>Invite rankings for this server.</p>
            </div>
            <div class="page-actions">
              <button class="button button-secondary" onclick="leaderboardPage.fetchLeaderboard()"><i class="fa-solid fa-rotate" aria-hidden="true"></i> Refresh</button>
            </div>
          </div>

          <section class="section">
            <div class="table-wrap">
              <div class="table-scroll">
                <table class="data-table" id="full-leaderboard-table">
                  <thead>
                    <tr>
                      <th>Rank</th>
                      <th>Member</th>
                      <th class="num">Net</th>
                      <th class="num">Regular</th>
                      <th class="num">Bonus</th>
                      <th class="num">Leaves</th>
                      <th class="num">Fake</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr><td colspan="7" class="loading-row">Loading leaderboard…</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>
        </section>
      </div>
    </main>
  </div>

  <div id="overlay-root"></div>
  <div id="toast-container"></div>

  <script src="/js/escapeHtml.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/pages/leaderboard.js"></script>
</body>
</html>
