<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochi · Overview</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍡</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body data-page="overview">
  <div id="app">
    <div id="sidebar-root"></div>
    <main class="main-content">
      <div id="topbar-root"></div>
      <div class="page-container">
        <section id="overview-view" class="view-section active">
          <div class="page-header">
            <div>
              <h2>Overview</h2>
              <p>Invite activity and bot status.</p>
            </div>
            <div class="page-actions">
              <button class="button button-secondary" onclick="overviewPage.refreshCurrentGuild()"><i class="fa-solid fa-rotate" aria-hidden="true"></i> Refresh</button>
            </div>
          </div>

          <div class="metrics">
            <div class="metric">
              <div class="metric-label">Members</div>
              <div class="metric-value" id="stat-total-members">—</div>
            </div>
            <div class="metric">
              <div class="metric-label">Tracked inviters</div>
              <div class="metric-value" id="stat-total-inviters">—</div>
            </div>
          </div>

          <div class="bot-status-line" id="bot-status-line">Checking bot status…</div>

          <div class="overview-cols">
            <section class="section">
              <div class="section-header">
                <h3 class="section-title">Top inviters</h3>
                <a href="/leaderboard" class="button button-secondary">View all</a>
              </div>
              <div class="table-wrap">
                <div class="table-scroll">
                  <table class="data-table" id="overview-leaderboard-table">
                    <thead>
                      <tr>
                        <th>Rank</th>
                        <th>Member</th>
                        <th>Net invites</th>
                        <th>Breakdown</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr><td colspan="4" class="loading-row">Loading inviters…</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </section>

            <section class="section">
              <div class="section-header">
                <h3 class="section-title">Recent joins</h3>
                <span class="status status-connected"><span class="status-dot" aria-hidden="true"></span> Realtime</span>
              </div>
              <div class="table-wrap">
                <div class="table-scroll">
                  <table class="data-table" id="overview-history-table">
                    <thead>
                      <tr>
                        <th>Member</th>
                        <th>Invited by</th>
                        <th>Code</th>
                        <th>Status</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr><td colspan="4" class="loading-row">Loading activity…</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </section>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="overlay-root"></div>
  <div id="toast-container"></div>

  <script src="/js/escapeHtml.js"></script>
  <script src="/js/constants.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/pages/overview.js"></script>
</body>
</html>
