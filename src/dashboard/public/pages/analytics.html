<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochi · Invite analytics</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍡</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body data-page="analytics">
  <div id="app">
    <div id="sidebar-root"></div>
    <main class="main-content">
      <div id="topbar-root"></div>
      <div class="page-container">
        <section id="analytics-view" class="view-section active">
          <div class="page-header">
            <div>
              <h2>Invite analytics</h2>
              <p>Join, leave, and retention trends.</p>
            </div>
            <div class="page-actions">
              <button class="button button-secondary" id="btn-sync-members" onclick="analyticsPage.syncHistoricalMembers()" title="Backfill all current members who joined before the bot was added"><i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i> Sync historical members</button>
              <button class="button button-secondary" onclick="analyticsPage.refreshAll()"><i class="fa-solid fa-rotate" aria-hidden="true"></i> Refresh</button>
            </div>
          </div>

          <div class="metrics">
            <div class="metric">
              <div class="metric-label">Active joins</div>
              <div class="metric-value" id="stat-active-joins">—</div>
            </div>
            <div class="metric">
              <div class="metric-label">Leaves</div>
              <div class="metric-value" id="stat-total-leaves">—</div>
            </div>
            <div class="metric">
              <div class="metric-label">Suspicious accounts</div>
              <div class="metric-value" id="stat-total-fakes">—</div>
            </div>
            <div class="metric">
              <div class="metric-label">Retention</div>
              <div class="metric-value" id="stat-retention-rate">—%</div>
            </div>
          </div>

          <section class="section">
            <div class="section-header">
              <div>
                <h3 class="section-title">Growth</h3>
                <p class="section-description">Last 7 days</p>
              </div>
            </div>
            <div class="panel">
              <div class="chart-panel">
                <canvas id="growthChart" aria-label="Join activity over the last 7 days"></canvas>
              </div>
            </div>
          </section>

          <section class="section">
            <div class="section-header">
              <h3 class="section-title">Member activity</h3>
            </div>

            <div class="toolbar">
              <div class="toolbar-left">
                <div class="tabs" id="activity-filter-tabs" role="tablist">
                  <button class="tab active" data-filter="all" onclick="analyticsPage.setFilter('all')" role="tab">All <span class="tab-count" id="count-all">0</span></button>
                  <button class="tab" data-filter="joins" onclick="analyticsPage.setFilter('joins')" role="tab">Joins <span class="tab-count" id="count-joins">0</span></button>
                  <button class="tab" data-filter="leaves" onclick="analyticsPage.setFilter('leaves')" role="tab">Leaves <span class="tab-count" id="count-leaves">0</span></button>
                  <button class="tab" data-filter="fakes" onclick="analyticsPage.setFilter('fakes')" role="tab">Suspicious <span class="tab-count" id="count-fakes">0</span></button>
                </div>
              </div>
              <div class="toolbar-right">
                <div class="search-input">
                  <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                  <input type="text" id="activity-search-input" class="form-control" placeholder="Search member, inviter, or code…" aria-label="Search activity" oninput="analyticsPage.handleSearch(this.value)">
                </div>
              </div>
            </div>

            <div class="table-wrap">
              <div class="table-scroll">
                <table class="data-table" id="analytics-activity-table">
                  <thead>
                    <tr>
                      <th>Member</th>
                      <th>Activity</th>
                      <th>Invited by</th>
                      <th>Status</th>
                      <th>When</th>
                    </tr>
                  </thead>
                  <tbody id="activity-table-body">
                    <tr><td colspan="5" class="loading-row">Loading activity…</td></tr>
                  </tbody>
                </table>
              </div>
            </div>

            <div class="pagination-bar" id="activity-pagination-bar" style="display: none;">
              <span id="pagination-info"></span>
              <div class="pagination-btns">
                <button class="button button-secondary button-sm" id="btn-prev-page" onclick="analyticsPage.prevPage()" disabled>Previous</button>
                <button class="button button-secondary button-sm" id="btn-next-page" onclick="analyticsPage.nextPage()" disabled>Next</button>
              </div>
            </div>
          </section>
        </section>
      </div>
    </main>
  </div>

  <div id="overlay-root"></div>
  <div id="toast-container"></div>

  <script src="/js/escapeHtml.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/pages/analytics.js"></script>
</body>
</html>
